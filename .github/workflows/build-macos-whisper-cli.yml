name: Build whisper.cpp macOS (Metal) - whisper-cli

on:
  workflow_dispatch:

jobs:
  build:
    name: macOS ${{ matrix.arch }}
    runs-on: macos-14

    strategy:
      fail-fast: false
      matrix:
        arch: [arm64, x86_64]

    steps:
      - name: Checkout (builder repo)
        uses: actions/checkout@v4

      - name: Show runner info
        run: |
          sw_vers
          uname -a
          clang --version
          cmake --version || true

      # README-style: clone the upstream repo then build with CMake
      - name: Clone whisper.cpp
        run: |
          rm -rf whisper.cpp
          git clone --depth 1 https://github.com/ggml-org/whisper.cpp.git
          cd whisper.cpp
          git rev-parse HEAD

      - name: Configure (Metal enabled)
        run: |
          cd whisper.cpp
          rm -rf build
          cmake -S . -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DGGML_USE_METAL=ON \
            -DCMAKE_OSX_ARCHITECTURES=${{ matrix.arch }}

      - name: Build whisper-cli
        run: |
          cd whisper.cpp
          cmake --build build --config Release --target whisper-cli -j 2

      - name: Prepare artifact (layout matches AutoLab extension needs)
        run: |
          set -e
          OUT="dist"
          rm -rf "$OUT"
          mkdir -p "$OUT/${{ matrix.arch }}"
          mkdir -p "$OUT/share/whisper-cpp"

          # 1) binary
          if [ -f "whisper.cpp/build/bin/whisper-cli" ]; then
            cp "whisper.cpp/build/bin/whisper-cli" "$OUT/${{ matrix.arch }}/whisper-cli"
          elif [ -f "whisper.cpp/build/whisper-cli" ]; then
            cp "whisper.cpp/build/whisper-cli" "$OUT/${{ matrix.arch }}/whisper-cli"
          else
            echo "ERROR: whisper-cli not found after build"
            find whisper.cpp/build -maxdepth 3 -type f -name "whisper-cli" -print || true
            exit 1
          fi

          # 2) metal resource (critical)
          if [ -f "whisper.cpp/ggml-metal.metal" ]; then
            cp "whisper.cpp/ggml-metal.metal" "$OUT/share/whisper-cpp/ggml-metal.metal"
          else
            echo "ERROR: ggml-metal.metal not found"
            find whisper.cpp -maxdepth 3 -type f -name "ggml-metal.metal" -print || true
            exit 1
          fi

          # make executable bit (helps when user copies out of zip)
          chmod +x "$OUT/${{ matrix.arch }}/whisper-cli"

          # quick sanity info
          file "$OUT/${{ matrix.arch }}/whisper-cli" || true
          ls -la "$OUT/${{ matrix.arch }}/" || true
          ls -la "$OUT/share/whisper-cpp/" || true

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: autolab-whisper-macos-${{ matrix.arch }}
          path: dist
          if-no-files-found: error
